const SCENARIOS=[{
  id:'puer-28-days',title:'阿姨傳來的普洱茶秘方',context:'家庭群組 · 阿姨的轉傳',angle:'找出處',answer:0,
  segments:[text('「這篇值得存！'),clue('study','日本有醫學研究發現','訊息沒有寫研究名稱、作者或連結，沒辦法查它說的是哪一篇。','message'),text('，每天三杯普洱茶，連續喝 '),clue('days','28 天就能清掉血管裡的油脂','天數和杯數寫得很具體，卻沒有說是怎麼量出來的。數字寫得再具體，也不等於證據。','message'),text('，讓血管年輕十歲。我朋友照著喝，'),clue('friend','說最近精神好多了','朋友覺得精神好，和血管有沒有變化是兩件事，訊息把它們接在一起了。','message'),text('。不用買昂貴補品，每天飯後一杯就好，家裡有長輩的可以看看。」')],
  attachment:null,references:[],finding:'說有研究，卻找不到出處，先當假的看。',
  feedback:[
    '你沒有被具體的天數和杯數帶著走，這份警覺很好。',
    '你留了一半的空間，沒有照單全收，這是好習慣。',
    '你把阿姨的好意放在心上，這很自然；喜歡普洱茶可以照常喝，只是訊息說的功效還查不到出處。'
  ],
  todo:'喜歡普洱茶可以照常喝，但別把它當成清血管的療法；用藥和回診照醫師的安排。'
},{
  id:'tea-and-iron',title:'午餐後的那杯茶',context:'朋友分享 · 飲茶時間提醒',angle:'看分寸',answer:2,
  segments:[text('「我午餐常配茶，最近看到一篇 2017 年的人體研究。它比較餐點配水、配茶和飯後一小時喝茶，發現茶配著餐點喝，會讓'),clue('iron','餐點中部分鐵的吸收減少','研究量的是餐點裡的「非血基質鐵」，主要是蔬菜、穀類這類食物裡的鐵。訊息只說「部分鐵」，沒有誇大成所有營養都吸收不了。','attachment','iron'),text('；'),clue('hour','隔一小時再喝，影響較小','研究確實比較了「配餐喝」和「一小時後喝」，訊息說的和研究量的是同一件事。','attachment','iron'),text('。所以想留意鐵吸收，可以考慮喝茶的時間。不過，'),clue('anemia','這不表示喝茶就一定會貧血','訊息自己畫了界線：一餐的吸收有差別，不等於每個人長期喝茶都會貧血。','message'),text('。原文和摘要附在下面。」')],
  attachment:{ref:'iron',label:'2017 年人體研究 · 中文摘要',lines:['12 名沒有貧血、鐵質充足的女性，吃同樣的粥，分別配水、配茶，或一小時後才喝茶。','研究量的是餐點中「非血基質鐵」的吸收量；一小時後才喝茶，吸收量比配餐喝茶來得高。']},
  references:[{id:'iron',label:'研究原文摘要（英文）',url:'https://pubmed.ncbi.nlm.nih.gov/29046302/'}],finding:'有研究依據，話也沒有說過頭。',
  feedback:[
    '看到健康提醒先打個問號，是好習慣。這一則比較特別：它附了研究，說的也沒有超出研究。',
    '你保留一點空間很合理：這是只有 12 個人的小型試驗，確實不能代表所有人。',

  ],
  todo:'如果醫師提醒過你要留意鐵質，可以和醫師聊聊喝茶的時間，例如改到飯後一小時；沒有這個顧慮，照平常的習慣就好。'
},{
  id:'overnight-tea',title:'早上看到的隔夜茶警告',context:'生活群組 · 轉傳提醒',angle:'分風險',answer:1,
  segments:[text('「昨晚泡的茶，今天千萬別喝！有人整理說'),clue('smell','茶放久會變味，是因為有害物質增加','食藥署的說法是：茶在常溫放久了容易孳生細菌，所以會酸敗變味。變味是變質的訊號，不等於產生了致癌物。','check','fda'),text('，'),clue('cancer','放一晚就會累積到致癌的程度','訊息沒有提供任何測量數字或研究。我們查了食藥署的說明：目前沒有研究證實隔夜茶和致癌有關。','check','fda'),text('，'),clue('all','就算蓋好、放冰箱，只要隔夜都一樣','這句話把保存方式全部忽略了。食藥署提醒的是保存環境和變質，不是「有沒有過夜」。','check','fda'),text('。我婆婆以前喝了隔夜茶拉肚子，'),clue('stomach','就是這個原因','食藥署提到，放久的茶可能讓胃不舒服或拉肚子。那是變質造成的腸胃問題，不能拿來證明會致癌。','check','fda'),text('。寧可倒掉，也不要拿健康冒險，提醒身邊的人！」')],attachment:null,
  references:[{id:'fda',label:'食藥署：隔夜茶喝了會致癌，是真的嗎？',url:'https://www.fda.gov.tw/tc/newsContent.aspx?cid=5049&id=13916'}],finding:'茶放久會變質是真的，會致癌沒有依據。',

},{
  id:'coffee-green-tea',title:'朋友分享的新配方',context:'朋友私訊 · 附上一份研究摘要',angle:'對原文',answer:1,
  segments:[text('「最近找到一個省錢配方：'),clue('recipe','咖啡加綠茶，一比一','研究用的是成分固定的特製飲品，沒有測過「家裡的咖啡和綠茶各倒一半」。','attachment','blend'),text('，'),clue('fat','不用節食就能甩油','研究量的是血糖這類指標，不是減脂。研究量的是一件事，不能拿來說另一件事有效。','attachment','blend'),text('！這篇 2022 年的研究有實驗，摘要也寫效果有改善，所以不只是網路偏方。我把'),clue('study','研究摘要附在下面','研究對象是 11 名健康男性、為期三週。就算指標有改善，也不能保證每個人照這個配方喝都有效。','attachment','blend'),text('，明天準備自己調一杯，想瘦的可以一起試試。」')],

    '你分得很清楚：研究是真的，朋友的結論卻多說了一截。',

    }catch(e){if(e.name==='AbortError'){announce('已取消分享。');return;}}
  }
  try{
    if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(text);
    document.getElementById('share-status').textContent='分享文字已複製。';
  }catch(e){
    const fallback=document.getElementById('share-fallback');fallback.hidden=false;
    const field=document.getElementById('share-copy');field.value=text;field.focus();field.select();
    document.getElementById('share-status').textContent='可以直接選取並複製下方文字。';
  }
}
async function downloadCard(){
  const blob=shareFile||await new Promise(resolve=>{const canvas=cardCanvas();if(canvas)canvas.toBlob(resolve,'image/png');else resolve(null);});
  if(!blob){document.getElementById('share-status').textContent='目前無法產生圖片，可以分享文字。';return;}
  const url=URL.createObjectURL(blob),a=h('a',{href:url,download:'茶訊拆招員.png'});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  document.getElementById('share-status').textContent='通關卡已產生。';
}
function restart(){
  state=freshState();save();shareFile=null;scrollPositions.clear();
  history.replaceState(null,'','#home');route=parseRoute();render();
}
function finish(){
  if(state.finishLine===null){state.finishLine=Math.floor(Math.random()*FINISH_LINES.length);save();}
  prepareCard();
  return h('section',{class:'finish-page'},h('div',{class:'finish-card',id:'finish-card'},h('p',{class:'eyebrow'},`${SCENARIOS.length} 案完成 · 通關紀念`),heading('六杯茶喝完，\n消息沒全吞。','finish-title'),radar(),h('p',{class:'finish-rank'},'通關稱號｜茶訊拆招員'),h('p',{class:'finish-best'},`判斷力 ${totalScore()}／600 · 最拿手「${bestAngle()}」`),h('p',{class:'finish-quote'},FINISH_LINES[state.finishLine]),h('p',{class:'finish-signature'},'茶訊調查局')),h('div',{class:'finish-actions'},h('button',{class:'btn primary',id:'share-card',type:'button',onclick:shareCard},'分享通關卡'),h('button',{class:'btn',id:'save-card',type:'button',onclick:downloadCard},'存成圖片')),h('p',{id:'share-status',class:'share-status',role:'status'},''),h('div',{id:'share-fallback',hidden:true},h('label',{for:'share-copy'},'分享文字'),h('textarea',{id:'share-copy',readonly:true,rows:5})),h('button',{class:'text-button',type:'button',id:'restart-game',onclick:restart},'回首頁，再玩一次'));
}
function render(restore=false){
  route=normalizeRoute(route);
  if(location.hash!==routeHash(route))history.replaceState(null,'',routeHash(route));
  actions.replaceChildren();
  screen.replaceChildren(route.view==='home'?home():route.view==='finish'?finish():route.view==='case'?casePage(getCase(route.id)):review(getCase(route.id)));
  document.body.dataset.view=route.view;
  document.title=route.id?`${getCase(route.id).title}｜茶訊調查局`:route.view==='finish'?'茶訊拆招員｜茶訊調查局':'茶訊調查局｜喝茶的健康消息';
  document.getElementById('storage-notice').hidden=storageAvailable;
  const y=restore?scrollPositions.get(routeKey(route)):undefined;
  window.scrollTo(0,y??0);
  document.getElementById('page-title')?.focus({preventScroll:true});
}
window.addEventListener('hashchange',()=>{scrollPositions.set(routeKey(route),window.scrollY);announce('');route=parseRoute();render(true);});
window.addEventListener('scroll',()=>scrollPositions.set(routeKey(route),window.scrollY),{passive:true});
// 另一個分頁改了進度時跟著更新，避免舊畫面把新進度蓋掉。
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){state=loadState();route=parseRoute();render();}});
if('scrollRestoration'in history)history.scrollRestoration='manual';
render();
</script>
