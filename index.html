<script>

// 訊息裡只要有一部分是真的，調查局的看法就是半真半假。
const VERDICTS=['假的','半真半假','真的'];
const text=value=>({text:value});
const clue=(id,value,hint,basis,ref=null)=>({id,text:value,hint,basis,ref});

const SCENARIOS=[{
  id:'puer-28-days',title:'阿姨傳來的普洱茶秘方',context:'家庭群組 · 阿姨的轉傳',from:'阿姨',time:'07:12',angle:'找出處',answer:0,
  segments:[text('「這篇值得存！'),clue('study','日本有醫學研究發現','訊息沒有寫研究名稱、作者或連結，沒辦法查它說的是哪一篇。','message'),text('，每天三杯普洱茶，連續喝 '),clue('days','28 天就能清掉血管裡的油脂','天數和杯數寫得很具體，卻沒有說是怎麼量出來的。數字寫得再具體，也不等於證據。','message'),text('，讓血管年輕十歲。我朋友照著喝，'),clue('friend','說最近精神好多了','朋友覺得精神好，和血管有沒有變化是兩件事，訊息把它們接在一起了。','message'),text('。不用買昂貴補品，每天飯後一杯就好，家裡有長輩的可以看看。」')],
  attachment:null,references:[],finding:'說有研究，卻找不到出處，先當假的看。',
  feedback:[
    '你沒有被具體的天數和杯數帶著走，這份警覺很好。',
    '你留了一半的空間，沒有照單全收，這是好習慣。',
    '你把阿姨的好意放在心上，這很自然；喜歡普洱茶可以照常喝，只是訊息說的功效還查不到出處。'
  ],
  todo:'喜歡普洱茶可以照常喝，但別把它當成清血管的療法；用藥和回診照醫師的安排。'
},{
  id:'tea-and-iron',title:'午餐後的那杯茶',context:'朋友分享 · 飲茶時間提醒',from:'朋友',time:'12:48',angle:'看分寸',answer:2,
  segments:[text('「我午餐常配茶，最近看到一篇 2017 年的人體研究。它比較餐點配水、配茶和飯後一小時喝茶，發現茶配著餐點喝，會讓'),clue('iron','餐點中部分鐵的吸收減少','研究量的是餐點裡的「非血基質鐵」，主要是蔬菜、穀類這類食物裡的鐵。訊息只說「部分鐵」，沒有誇大成所有營養都吸收不了。','attachment','iron'),text('；'),clue('hour','隔一小時再喝，影響較小','研究確實比較了「配餐喝」和「一小時後喝」，訊息說的和研究量的是同一件事。','attachment','iron'),text('。所以想留意鐵吸收，可以考慮喝茶的時間。不過，'),clue('anemia','這不表示喝茶就一定會貧血','訊息自己畫了界線：一餐的吸收有差別，不等於每個人長期喝茶都會貧血。','message'),text('。原文和摘要附在下面。」')],
  attachment:{ref:'iron',label:'2017 年人體研究 · 中文摘要',lines:['12 名沒有貧血、鐵質充足的女性，吃同樣的粥，分別配水、配茶，或一小時後才喝茶。','研究量的是餐點中「非血基質鐵」的吸收量；一小時後才喝茶，吸收量比配餐喝茶來得高。']},
  references:[{id:'iron',label:'研究原文摘要（英文）',url:'https://pubmed.ncbi.nlm.nih.gov/29046302/'}],finding:'有研究依據，話也沒有說過頭。',
  feedback:[
    '看到健康提醒先打個問號，是好習慣。這一則比較特別：它附了研究，說的也沒有超出研究。',
    '你保留一點空間很合理：這是只有 12 個人的小型試驗，確實不能代表所有人。',
    '你看出這則訊息有憑有據，而且話沒有說過頭，判斷很準。'
  ],
  todo:'如果醫師提醒過你要留意鐵質，可以和醫師聊聊喝茶的時間，例如改到飯後一小時；沒有這個顧慮，照平常的習慣就好。'
},{
  id:'overnight-tea',title:'早上看到的隔夜茶警告',context:'生活群組 · 轉傳提醒',from:'群友',time:'06:55',angle:'分風險',answer:1,
  segments:[text('「昨晚泡的茶，今天千萬別喝！有人整理說'),clue('smell','茶放久會變味，是因為有害物質增加','食藥署的說法是：茶在常溫放久了容易孳生細菌，所以會酸敗變味。變味是變質的訊號，不等於產生了致癌物。','check','fda'),text('，'),clue('cancer','放一晚就會累積到致癌的程度','訊息沒有提供任何測量數字或研究。我們查了食藥署的說明：目前沒有研究證實隔夜茶和致癌有關。','check','fda'),text('，'),clue('all','就算蓋好、放冰箱，只要隔夜都一樣','這句話把保存方式全部忽略了。食藥署提醒的是保存環境和變質，不是「有沒有過夜」。','check','fda'),text('。我婆婆以前喝了隔夜茶拉肚子，'),clue('stomach','就是這個原因','食藥署提到，放久的茶可能讓胃不舒服或拉肚子。那是變質造成的腸胃問題，不能拿來證明會致癌。','check','fda'),text('。寧可倒掉，也不要拿健康冒險，提醒身邊的人！」')],attachment:null,
  references:[{id:'fda',label:'食藥署：隔夜茶喝了會致癌，是真的嗎？',url:'https://www.fda.gov.tw/tc/newsContent.aspx?cid=5049&id=13916'}],finding:'茶放久會變質是真的，會致癌沒有依據。',
  feedback:[
    '你沒有被「致癌」兩個字嚇到，判斷很穩。補充一點：茶放久會變質、可能鬧肚子，這部分倒是真的。',
    '你分得很清楚：茶放久確實可能變質，但那和致癌是兩回事。',

  ],

const persona=()=>totalScore()===SCENARIOS.length*100?TOP_PERSONA:PERSONAS[bestAngle()];

let shareFile=null,cardData='';
const cardName=()=>`茶訊調查局-${persona()[0]}.png`;
function prepareCard(){
