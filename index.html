function home(){

function chatHead(c,revealed=false){

  return h('header',{class:'chat-head'},h('div',{class:'chat-nav'},h('p',{class:'chat-name'},c.context)),
    h('div',{class:'announce'},h('i',{class:'i-announce','aria-hidden':'true'}),h('div',{},heading(c.title),h('div',{class:'progress'},h('p',{class:'eyebrow'},`第 ${index+1} 案／${SCENARIOS.length}${revealed?' · 解析':''}`),h('div',{class:'case-dots','aria-hidden':'true'},SCENARIOS.map((_,i)=>h('span',{class:i<=index?'filled':''})))))));

function toggleClue(c,id){

  }
  const button=document.getElementById(`clue-${id}`),note=document.getElementById(`hint-${id}`);

// 通關卡的版面：左右留白 M，四個區塊（稱號、六角圖底板、總分、分享用的 QR 頁尾）之間各留一段固定間距。
// 畫面上的卡不帶 QR；share 為 true 時在卡片下方多接一條頁尾，只出現在分享與下載的圖上。
function cardCanvas(share=false){
  const W=1080,CARD=1350,FOOT=283,M=96,H=share?CARD+FOOT:CARD,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');if(!ctx)return null;
  const [title,line]=persona(),ink='#17231d',font=(weight,size)=>`${weight} ${size}px "Noto Serif TC",serif`;
  const box=(x,y,w,h,r)=>{ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();};
  // 卡面跟首頁同一個調子：米色斜向漸層、右上一團琥珀暖光、左下一點淡光，再鋪首頁的細點與一層顆粒，避免大面積漸層出現色階斷層。
  const tea='#8a4f24',bg=ctx.createLinearGradient(0,0,W*.55,CARD);[[0,'#fbf7ee'],[.5,'#f6f0e2'],[1,'#efe4cd']].forEach(([at,color])=>bg.addColorStop(at,color));ctx.fillStyle=bg;ctx.fillRect(0,0,W,CARD);
  const glow=(x,y,r,stops)=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([at,color])=>g.addColorStop(at,color));ctx.fillStyle=g;ctx.fillRect(0,0,W,CARD);};
  glow(W-120,60,780,[[0,'#f6b93b99'],[.45,'#f6b93b33'],[1,'#f6b93b00']]);glow(80,CARD-40,620,[[0,'#f0c98a40'],[1,'#f0c98a00']]);
  // 茶葉線描底紋（試用圖，640×900，來源 pngtree，公開前要確認授權）：等寬鋪滿卡面，用色彩增值疊上去，白底等於沒畫。
  if(LEAVES?.complete&&LEAVES.naturalWidth){const h=W*LEAVES.naturalHeight/LEAVES.naturalWidth;ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.22;ctx.drawImage(LEAVES,0,(CARD-h)/2,W,h);ctx.restore();}
  const grain=document.createElement('canvas');grain.width=grain.height=160;const g=grain.getContext('2d');
  if(g){let seed=7;for(let y=0;y<160;y++)for(let x=0;x<160;x++){seed=seed*16807%2147483647;g.fillStyle=seed%2?'#ffffff':'#000000';g.globalAlpha=(seed%97)/97*.04;g.fillRect(x,y,1,1);}ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,W,CARD);}
  ctx.strokeStyle='#17231d1f';ctx.lineWidth=3;ctx.strokeRect(40,40,W-80,CARD-80);
  // 刊頭跟首頁一樣：粗襯線字、字距拉開，後面跟一杯茶。
  ctx.textAlign='left';ctx.fillStyle=ink;ctx.font=font(900,54);let bx=M;for(const ch of '茶訊調查局'){ctx.fillText(ch,bx,138);bx+=ctx.measureText(ch).width+5;}
  ctx.font='50px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.fillText('🍵',bx+10,136);
  ctx.fillStyle=tea;ctx.font=font(700,38);ctx.fillText('我的調查員類型',M,228);
  ctx.font=font(900,150);ctx.fillStyle='#f6b93bb3';ctx.fillRect(M,382,ctx.measureText(title).width,40);
  ctx.fillStyle=ink;ctx.fillText(title,M,415);
  ctx.fillStyle='#17231dd9';ctx.font=font(700,42);ctx.fillText(`「${line}」`,M-14,518,W-M*2);
  // 六角圖放在一塊半透明白底板上，像首頁的通知卡：分得出層次，又不搶稱號。
  ctx.save();ctx.shadowColor='#8a4f2426';ctx.shadowBlur=48;ctx.shadowOffsetY=14;ctx.fillStyle='#ffffffa6';box(M,576,W-M*2,550,32);ctx.restore();
  const cx=540,cy=851,R=145,pt=(i,r)=>radarPoint(i,r,cx,cy);
  const path=r=>{ctx.beginPath();SCENARIOS.forEach((c,i)=>{const [x,y]=pt(i,typeof r==='function'?r(c):r);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();};
  ctx.strokeStyle='#17231d29';ctx.lineWidth=2;for(const f of [.25,.5,.75,1]){path(R*f);ctx.stroke();}
  SCENARIOS.forEach((c,i)=>{ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(...pt(i,R));ctx.stroke();});
  path(c=>R*scoreOf(c)/100);ctx.fillStyle='#f6b93b80';ctx.fill();ctx.strokeStyle='#d98e0b';ctx.lineWidth=6;ctx.stroke();
  ctx.font=font(700,36);
  SCENARIOS.forEach((c,i)=>{const [x,y]=pt(i,R+28),side=Math.round(x-cx);ctx.textAlign=side>0?'left':side<0?'right':'center';const top=i===0?y-46:i===3?y+34:y-8;ctx.fillStyle=ink;ctx.fillText(c.angle,x,top);ctx.fillStyle=tea;ctx.fillText(String(scoreOf(c)),x,top+44);});
  ctx.textAlign='left';ctx.fillStyle=ink;ctx.font=font(700,40);ctx.fillText('判斷力',M,1262);
  ctx.textAlign='right';ctx.fillText('／600',W-M,1262);
  const unit=ctx.measureText('／600').width;ctx.fillStyle=tea;ctx.font=font(900,104);ctx.fillText(String(totalScore()),W-M-unit-8,1262);
  const qr=share&&qrMatrix(GAME_URL);
  if(share){ctx.fillStyle='#ffffff';ctx.fillRect(0,CARD,W,FOOT);ctx.fillStyle='#17231d1f';ctx.fillRect(0,CARD,W,3);}
  if(qr){
    // 模組用整數像素；淺色頁尾本身就是 QR 四周的留白。
    const cell=7,size=cell*qr.length,x0=W-M-size,y0=CARD+(FOOT-size)/2;
    ctx.fillStyle=ink;qr.forEach((row,y)=>row.forEach((dark,x)=>{if(dark)ctx.fillRect(x0+x*cell,y0+y*cell,cell,cell);}));
    ctx.textAlign='left';ctx.font=font(900,52);ctx.fillText('掃碼換你查',M,CARD+FOOT/2+18);
  }
  return canvas;
}
let shareFile=null,cardData='';
const cardName=()=>`茶訊調查局-${persona()[0]}.png`;
function prepareCard(){
  try{
    const shown=cardCanvas(),shared=cardCanvas(true);if(!shown||!shared)return false;
    // 在分享按鈕出現前建好檔案，保留系統分享需要的即時使用者操作；畫成功才換掉手上的圖。
    const data=shown.toDataURL('image/png');
    const bytes=Uint8Array.from(atob(shared.toDataURL('image/png').split(',')[1]),char=>char.charCodeAt(0));
    shareFile=new File([bytes],cardName(),{type:'image/png'});cardData=data;return true;
  }catch(e){return false;/* 圖片不可用時仍可分享文字。 */}
}
async function shareCard(){
  const text=shareText();
  if(navigator.share){
    try{
      const data={title:'茶訊調查局',text};
      if(shareFile&&navigator.canShare?.({files:[shareFile]}))data.files=[shareFile];
      try{await navigator.share(data);}catch(e){
        // 有些接收端不收圖片：帶圖失敗就只分享文字再試一次。
        if(e.name==='AbortError'||!data.files)throw e;
        await navigator.share({title:data.title,text});
      }
      announce('分享完成。');return;
    }catch(e){if(e.name==='AbortError'){announce('已取消分享。');return;}}
  }
  try{
    if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(text);
    document.getElementById('share-status').textContent='分享文字已複製。';
  }catch(e){
    const fallback=document.getElementById('share-fallback');fallback.hidden=false;
    const field=document.getElementById('share-copy');field.value=text;field.focus();field.select();
    document.getElementById('share-status').textContent='可以直接選取並複製下方文字。';
  }
}
function downloadCard(){
  if(!shareFile){document.getElementById('share-status').textContent='目前無法產生圖片，可以分享文字。';return;}
  const url=URL.createObjectURL(shareFile),a=h('a',{href:url,download:cardName()});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  document.getElementById('share-status').textContent='圖片已送出下載。';
}
function restart(){
  state=freshState();save();shareFile=null;cardData='';scrollPositions.clear();
  history.replaceState(null,'','#home');route=parseRoute();render();
}
// 通關慶祝：彩紙從上方灑落，四朵煙火依序在卡片周圍綻開；位置與時間用索引算，每次都一樣。
function party(){
  const colors=['#f6b93b','#ff9b7a','#8fd0ee','#06c755','#8a4f24','#ffe873'];
  const confetti=Array.from({length:36},(_,i)=>h('span',{class:i%3?'confetti':'confetti dot',style:`left:${(i*37)%100}%;background:${colors[i%6]};--x:${(i*53)%60-30}px;--r:${360+(i*97)%540}deg;--d:${(.3+(i%12)*.09).toFixed(2)}s;--t:${2.2+(i%5)*.25}s`}));
  const bursts=[[22,14,.5],[78,8,.85],[60,32,1.2],[28,40,1.6]].map(([x,y,d],b)=>h('span',{class:'burst',style:`left:${x}%;top:${y}%;--d:${d}s`},Array.from({length:20},(_,k)=>h('span',{class:'spark',style:`--a:${k*18+b*9}deg;--len:${k%2?56:88}px;--c:${colors[(k+b)%6]}`}))));
  return h('div',{class:'party','aria-hidden':'true'},confetti,bursts);
}
function finish(){
  shareFile=null;cardData='';prepareCard();
  // 畫面上的通關卡是一張圖；存下來、分享出去的是同一張再多一條 QR 頁尾。
  const img=cardData?h('img',{class:'poster',id:'finish-card',src:cardData,alt:cardAlt(),width:1080,height:1350}):null;
  const card=img?h('div',{class:'float'},img):h('p',{class:'poster-text',id:'finish-card'},cardAlt());
  if(cardData&&document.fonts?.load){
    // 第一張先用現成字型畫好；網頁字型和底紋圖到齊後重畫一次。
    const sample='茶訊調查局我的調查員類型判斷力掃碼換你查／0123456789「」'+persona().join('')+SCENARIOS.map(c=>c.angle).join('');
    // 字型樣式表不擋首屏，可能比通關頁晚到：現在載一次，整頁載完再補一次，卡上才不會混到備用字型。
    const redraw=()=>Promise.all(['700 40px "Noto Serif TC"','900 150px "Noto Serif TC"'].map(f=>document.fonts.load(f,sample)).concat(LEAVES?.decode?LEAVES.decode().catch(()=>{}):[])).then(()=>{if(img.isConnected&&prepareCard())img.src=cardData;}).catch(()=>{});
    redraw();if(document.readyState!=='complete')window.addEventListener('load',redraw,{once:true});
  }
  return h('section',{class:'finish-page'},party(),heading('六案查完，結案！','finish-title'),card,h('div',{class:'finish-actions'},h('button',{class:'btn primary',id:'share-card',type:'button',onclick:shareCard},'分享給朋友'),h('button',{class:'btn',id:'save-card',type:'button',onclick:downloadCard},'存成圖片')),h('p',{id:'share-status',class:'share-status',role:'status'},''),h('div',{id:'share-fallback',hidden:true},h('label',{for:'share-copy'},'分享文字'),h('textarea',{id:'share-copy',readonly:true,rows:4})),h('button',{class:'text-button',type:'button',id:'restart-game',onclick:restart},'回首頁，再玩一次'));
}
function render(restore=false){
  route=normalizeRoute(route);
  if(location.hash!==routeHash(route))history.replaceState(null,'',routeHash(route));
  actions.replaceChildren();
  screen.replaceChildren(route.view==='home'?home():route.view==='finish'?finish():route.view==='case'?casePage(getCase(route.id)):review(getCase(route.id)));
  document.body.dataset.view=route.view;
  document.title=route.id?`${getCase(route.id).title}｜茶訊調查局`:route.view==='finish'?`${persona()[0]}｜茶訊調查局`:'茶訊調查局｜喝茶的健康消息';
  document.getElementById('storage-notice').hidden=storageAvailable;
  const y=restore?scrollPositions.get(routeKey(route)):undefined;
  window.scrollTo(0,y??0);
  document.getElementById('page-title')?.focus({preventScroll:true});
}
window.addEventListener('hashchange',()=>{scrollPositions.set(routeKey(route),window.scrollY);announce('');route=parseRoute();render(true);});
window.addEventListener('scroll',()=>scrollPositions.set(routeKey(route),window.scrollY),{passive:true});
// 另一個分頁改了進度時跟著更新，避免舊畫面把新進度蓋掉。
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){state=loadState();route=parseRoute();render();}});
if('scrollRestoration'in history)history.scrollRestoration='manual';
render();
</script>
