<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>茶訊調查局｜第一案</title>
    <meta name="description" content="收到一則喝茶保健的轉傳訊息。跟著線索查一查，練習判斷訊息可不可信。">
    <meta name="author" content="山茗主義 Summit Tea">
    <meta property="og:title" content="茶訊調查局｜第一案">
    <meta property="og:description" content="收到一則喝茶保健的轉傳訊息。跟著線索查一查。🍵">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#F4F0EC">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap"
        rel="stylesheet">
    <style>
        /* ========== 樣式 ========== */
        :root {
            --paper: #F4F0EC;
            --folder: #EADFC8;
            --card: #FFFFFF;
            --ink: #111111;
            --muted: #55504A;
            --red: #E34234;
            --green: #008B45;
            --mark: #FFF3A8;
            --line: 3px solid var(--ink);
            --serif: 'Playfair Display', 'Noto Serif TC', serif;
            --mono: 'Space Mono', 'Noto Serif TC', monospace;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-padding-bottom: 150px;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            font-family: var(--serif);
            font-weight: 500;
            font-size: 18px;
            line-height: 1.7;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(rgba(17, 17, 17, .55) 1px, transparent 1px);
            background-size: 30px 30px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        ::selection {
            background: var(--red);
            color: #fff;
        }

        button {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--red);
            outline-offset: 3px;
        }

        [tabindex="-1"]:focus {
            outline: none;
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: 20px 16px 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* 報頭 */
        .masthead {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 4px solid var(--ink);
            padding-bottom: 10px;
        }

        .masthead h1 {
            margin: 0;
            font-size: clamp(34px, 11vw, 52px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -.02em;
        }

        .seal {
            flex: none;
            width: 52px;
            height: 52px;
            border: 3px solid var(--ink);
            border-radius: 50%;
            background: var(--ink);
            color: var(--paper);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 24px;
            transform: rotate(-8deg);
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            font-family: var(--mono);
            font-weight: 700;
            font-size: 15px;
        }

        .progress[hidden] {
            display: none;
        }

        .progress-bar {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .progress-bar span {
            height: 10px;
            border: 2px solid var(--ink);
            background: var(--card);
        }

        .progress-bar span.on {
            background: var(--ink);
        }

        /* 案卷夾 */
        .folder {
            position: relative;
            margin: 44px 0 24px;
            background: var(--folder);
            border: var(--line);
            box-shadow: 8px 8px 0 var(--ink);
            padding: 20px 16px 24px;
        }

        .folder-tab {
            position: absolute;
            left: -3px;
            top: -35px;
            height: 35px;
            padding: 4px 18px 0;
            background: var(--folder);
            border: var(--line);
            border-bottom: none;
            font-family: var(--mono);
            font-weight: 700;
            font-size: 15px;
        }

        .phase-title {
            margin: 0 0 16px;
            font-size: 26px;
            font-weight: 900;
            line-height: 1.35;
        }

        .phase-title.big {
            font-size: 40px;
            letter-spacing: .04em;
        }

        .block {
            margin-top: 22px;
        }

        .label {
            display: inline-block;
            font-family: var(--mono);
            font-weight: 700;
            font-size: 14px;
            background: var(--ink);
            color: var(--paper);
            padding: 2px 8px;
            letter-spacing: .04em;
        }

        /* 被夾住的訊息卡 */
        .message {
            position: relative;
            background: var(--card);
            border: var(--line);
            padding: 26px 14px 16px;
            transform: rotate(-.6deg);
            box-shadow: 4px 4px 0 rgba(17, 17, 17, .25);
        }

        .clip {
            position: absolute;
            top: -22px;
            left: 22px;
            width: 22px;
            height: 50px;
            pointer-events: none;
        }

        .message-type {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 8px;
            text-align: right;
        }

        .bubble {
            position: relative;
            background: #F6F6F2;
            border: 2px solid var(--ink);
            padding: 12px 14px;
            margin-left: 10px;
            white-space: pre-line;
            overflow-wrap: anywhere;
            font-size: 19px;
            line-height: 1.85;
        }

        .bubble::before {
            content: "";
            position: absolute;
            left: -12px;
            top: 14px;
            border-width: 8px 12px 8px 0;
            border-style: solid;
            border-color: transparent var(--ink) transparent transparent;
        }

        .bubble.hunt {
            line-height: 2.2;
        }

        .para-break {
            display: block;
            height: .5em;
        }

        /* 線索句：上下留白撐出觸控區，底線與底色畫在背景裡才不會離字太遠 */
        .seg {
            cursor: pointer;
            padding: 11px 1px;
            background:
                linear-gradient(to right, var(--ink) 55%, transparent 55%) 0 77% / 7px 2px repeat-x,
                linear-gradient(transparent 25%, var(--mark) 25%, var(--mark) 75%, transparent 75%);
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }

        .seg.check {
            background:
                linear-gradient(var(--ink), var(--ink)) 0 78% / 100% 3px no-repeat,
                linear-gradient(transparent 25%, var(--mark) 25%, var(--mark) 75%, transparent 75%);
        }

        .seg.skip {
            color: var(--muted);
            background: linear-gradient(#9A948C, #9A948C) 0 77% / 100% 2px no-repeat;
        }

        .nowrap {
            white-space: nowrap;
        }

        .seg-static {
            padding: 0;
            cursor: default;
            background-position: 0 100%, 0 0;
        }

        .tag {
            display: inline-block;
            margin: 0 3px;
            padding: 0 6px;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.6;
            vertical-align: 2px;
            white-space: nowrap;
            border: 2px solid currentColor;
        }

        .tag.check {
            color: var(--ink);
        }

        .tag.skip {
            color: var(--muted);
        }

        .hint {
            display: block;
            white-space: normal;
            margin: 6px 0 10px;
            padding: 8px 10px;
            background: var(--card);
            border: 2px solid var(--ink);
            border-left: 6px solid var(--ink);
            font-size: 17px;
            line-height: 1.6;
        }

        .hint.skip {
            border-left-color: #9A948C;
        }

        .note {
            margin: 18px 0 0;
            padding: 10px 12px;
            background: var(--card);
            border: 2px dashed var(--ink);
            font-size: 17px;
        }

        .note b {
            font-family: var(--mono);
            font-size: 14px;
            margin-right: 6px;
        }

        details.recall {
            margin-bottom: 20px;
        }

        details.recall>summary {
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            list-style: none;
            font-weight: 700;
            border: 2px solid var(--ink);
            background: var(--card);
            padding: 6px 12px;
        }

        details.recall>summary::-webkit-details-marker {
            display: none;
        }

        details.recall>summary::after {
            content: "▾";
            margin-left: auto;
        }

        details.recall[open]>summary::after {
            content: "▴";
        }

        details.recall .message {
            margin-top: 28px;
        }

        /* 選項 */
        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            min-height: 56px;
            width: 100%;
            padding: 10px 16px;
            text-align: left;
            font-size: 20px;
            font-weight: 700;
            background: var(--card);
            border: var(--line);
            box-shadow: 5px 5px 0 var(--ink);
            cursor: pointer;
            transition: transform .08s, box-shadow .08s;
        }

        .option:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }

        .option[aria-pressed="true"] {
            background: var(--ink);
            color: var(--paper);
        }

        @media (min-width: 560px) {
            .options.row {
                grid-template-columns: repeat(3, 1fr);
            }

            .options.row .option {
                text-align: center;
            }
        }

        .result {
            margin-top: 16px;
            padding: 12px 14px;
            background: var(--card);
            border: var(--line);
            border-left-width: 8px;
            font-size: 18px;
        }

        /* 滑桿 */
        .belief {
            background: var(--card);
            border: var(--line);
            padding: 14px 14px 10px;
        }

        .belief-value {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 30px;
            text-align: center;
            line-height: 1.3;
        }

        .belief.untouched .belief-value {
            color: var(--muted);
            font-size: 22px;
        }

        .belief input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: 48px;
            margin: 6px 0 0;
            background: transparent;
            cursor: pointer;
            touch-action: pan-y;
        }

        .belief input[type=range]::-webkit-slider-runnable-track {
            height: 12px;
            background: var(--paper);
            border: 2px solid var(--ink);
        }

        .belief input[type=range]::-moz-range-track {
            height: 8px;
            background: var(--paper);
            border: 2px solid var(--ink);
        }

        .belief input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 36px;
            height: 36px;
            margin-top: -14px;
            background: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 0;
        }

        .belief input[type=range]::-moz-range-thumb {
            width: 30px;
            height: 30px;
            background: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 0;
        }

        .belief.untouched input[type=range]::-webkit-slider-thumb {
            background: var(--card);
            border-style: dashed;
        }

        .belief.untouched input[type=range]::-moz-range-thumb {
            background: var(--card);
            border-style: dashed;
        }

        .belief-ends {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
        }

        /* 證據卡 */
        .cards {
            display: grid;
            gap: 16px;
        }

        .ecard {
            background: var(--card);
            border: var(--line);
        }

        .ecard.selected {
            box-shadow: 6px 6px 0 var(--ink);
            border-width: 4px;
        }

        .ecard-head {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 60px;
            padding: 8px 12px 8px 0;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            font-weight: 900;
        }

        .ecard-letter {
            flex: none;
            align-self: stretch;
            display: grid;
            place-items: center;
            width: 48px;
            margin: -8px 0;
            background: var(--ink);
            color: var(--paper);
            font-family: var(--mono);
            font-size: 22px;
        }

        .ecard-head .chev {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 14px;
            white-space: nowrap;
        }

        .ecard-body {
            border-top: 2px solid var(--ink);
            padding: 12px 14px 16px;
        }

        .ecard-body dl {
            margin: 10px 0 0;
        }

        .ecard-body dt {
            margin-top: 12px;
            font-family: var(--mono);
            font-weight: 700;
            font-size: 14px;
        }

        .ecard-body dd {
            margin: 2px 0 0;
        }

        .ecard-body dd a {
            display: inline-block;
            min-height: 44px;
            padding: 8px 0;
            color: var(--ink);
            font-weight: 700;
            text-underline-offset: 4px;
        }

        .ecard-actions {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            min-height: 52px;
            width: 100%;
            padding: 8px 16px;
            font-size: 19px;
            font-weight: 700;
            background: var(--card);
            border: var(--line);
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .btn[aria-pressed="true"] {
            background: var(--ink);
            color: var(--paper);
        }

        .btn[aria-disabled="true"] {
            color: var(--muted);
            border-style: dashed;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn[aria-disabled="true"]:active {
            transform: none;
        }

        /* 反思與分數 */
        .shift {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: var(--line);
            padding: 14px 10px;
            text-align: center;
        }

        .shift small {
            display: block;
            font-size: 16px;
            font-weight: 700;
        }

        .shift strong {
            font-family: var(--mono);
            font-size: 36px;
            line-height: 1.2;
        }

        .shift .arrow {
            font-size: 28px;
            font-weight: 900;
        }

        .facts {
            margin: 22px 0 0;
            display: grid;
            gap: 18px;
        }

        .fact {
            margin: 6px 0 0;
            font-size: 21px;
            font-weight: 900;
        }

        .facts .result {
            margin-top: 8px;
        }

        .verdict-box {
            position: relative;
            background: var(--card);
            border: var(--line);
            padding: 16px 14px 14px;
        }

        .stamp {
            display: inline-block;
            margin-bottom: 8px;
            padding: 2px 10px;
            border: 3px solid var(--ink);
            color: var(--ink);
            font-weight: 900;
            font-size: 22px;
            transform: rotate(-3deg);
        }

        .move {
            background: var(--ink);
            color: var(--paper);
            padding: 16px;
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            box-shadow: 6px 6px 0 var(--red);
        }

        .checklist {
            margin: 10px 0 0;
            padding: 0;
            list-style: none;
            counter-reset: n;
            display: grid;
            gap: 8px;
        }

        .checklist li {
            counter-increment: n;
            display: flex;
            gap: 10px;
            background: var(--card);
            border: 2px solid var(--ink);
            padding: 8px 12px;
        }

        .checklist li::before {
            content: counter(n);
            flex: none;
            font-family: var(--mono);
            font-weight: 700;
            color: var(--red);
        }

        .scores {
            display: grid;
            gap: 14px;
        }

        .score {
            background: var(--card);
            border: var(--line);
            padding: 12px 14px 14px;
        }

        .score-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: 900;
            font-size: 21px;
        }

        .score-head span {
            font-family: var(--mono);
            font-size: 26px;
        }

        .meter {
            height: 14px;
            margin: 6px 0 10px;
            border: 2px solid var(--ink);
            background: var(--paper);
        }

        .meter i {
            display: block;
            height: 100%;
            background: var(--ink);
        }

        .score p {
            margin: 0;
        }

        .credit {
            margin: 0 0 16px;
            text-align: center;
            font-size: 15px;
            color: var(--muted);
        }

        .credit a {
            display: inline-block;
            min-height: 44px;
            padding: 10px 4px;
            color: var(--ink);
        }

        /* 底部操作列 */
        .actionbar {
            position: sticky;
            bottom: 0;
            z-index: 5;
            margin: auto -16px 0;
            padding: 10px 16px calc(12px + var(--safe-bottom));
            background: var(--paper);
            border-top: var(--line);
        }

        .actionbar-hint {
            margin: 0 0 8px;
            font-weight: 700;
            color: var(--muted);
            font-size: 17px;
            text-align: center;
        }

        .actionbar-hint.nudge {
            color: var(--red);
        }

        .actionbar-hint {
            line-height: 1.6;
            min-height: 1.6em;
        }

        .actionbar-row {
            display: flex;
        }

        .actionbar-row .back {
            margin-right: 12px;
        }

        .nav {
            min-height: 56px;
            padding: 8px 16px;
            font-size: 20px;
            font-weight: 900;
            border: var(--line);
            cursor: pointer;
            white-space: nowrap;
        }

        .nav.back {
            flex: none;
            background: var(--card);
        }

        .nav.back.gone {
            visibility: hidden;
        }

        .nav.primary {
            flex: 1;
            background: var(--ink);
            color: var(--paper);
            box-shadow: 4px 4px 0 var(--red);
        }

        .nav.primary:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .nav.primary[aria-disabled="true"] {
            background: #8A847D;
            border-color: #8A847D;
            box-shadow: none;
        }

        /* 動態 */
        .enter {
            animation: enter .45s cubic-bezier(.19, 1, .22, 1) both;
        }

        .pop {
            animation: pop .35s ease-out both;
        }

        .nudge {
            animation: nudge .35s ease-in-out;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.97);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes nudge {

            0%,
            100% {
                transform: none;
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .enter,
            .pop,
            .nudge {
                animation: none;
            }

            .message {
                transform: none;
            }
        }

        @media (min-width: 560px) {
            .page {
                padding-top: 36px;
            }

            .folder {
                padding: 28px 28px 32px;
            }

            .actionbar {
                margin-left: 0;
                margin-right: 0;
                border: var(--line);
                border-bottom: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="masthead">
            <h1>茶訊調查局</h1>
            <div class="seal" aria-hidden="true">查</div>
        </header>
        <div class="progress" id="progress" hidden>
            <span id="progress-text"></span>
            <div class="progress-bar" id="progress-bar" aria-hidden="true"></div>
        </div>

        <main class="folder">
            <div class="folder-tab" aria-hidden="true">案卷</div>
            <div id="screen"></div>
        </main>

        <p class="credit" id="credit" hidden>由<a href="https://www.facebook.com/SummitTeaTW" target="_blank"
                rel="noopener noreferrer">山茗主義</a>製作</p>

        <nav class="actionbar" aria-label="調查步驟">
            <p class="actionbar-hint" id="gate-hint" aria-live="polite"></p>
            <div class="actionbar-row">
                <button type="button" class="nav back" id="btn-back">上一步</button>
                <button type="button" class="nav primary" id="btn-next"></button>
            </div>
        </nav>
    </div>

    <p id="live" class="sr-only" aria-live="polite"></p>

    <noscript>
        <p style="padding:16px;font-size:18px">這個遊戲需要開啟 JavaScript 才能玩。</p>
    </noscript>

    <script>
        'use strict';

        /* ========== 共用設定（六案一字不差） ========== */
        const SHARED = {
            phases: ['MESSAGE', 'INITIAL_BELIEF', 'ACTION', 'CLUE_HUNT', 'EVIDENCE', 'FINAL_VERDICT', 'REFLECTION', 'RESULT'],
            prompts: {
                INITIAL_BELIEF: '這則訊息，你信幾分？',

        /* ========== 純狀態邏輯（不碰 DOM） ========== */
        const STORAGE_KEY = 'tea-investigation:v1';
        const PHASES = SHARED.phases;

        function freshState(scenarioId) {
            return {
                v: 1,
                scenarioId: scenarioId || SCENARIOS[0].id,
                phase: 'MESSAGE',
                reached: 0,
                initialBelief: null,
                actionId: null,
                openedClues: [],
                readEvidence: [],
                compared: false,
                selectedEvidenceId: null,
                verdictId: null,
                finalBelief: null
            };
        }

        function scenarioOf(state) {
            return SCENARIOS.find(s => s.id === state.scenarioId);
        }

        function checkCluesFound(state, sc) {
            return sc.clues.filter(c => c.kind === 'check' && state.openedClues.includes(c.id)).length;
        }

        function canPickEvidence(state) {
            return state.readEvidence.length >= SHARED.minEvidenceRead;
        }

        function visibleCards(state, sc) {
            return sc.evidenceCards.filter(c => !c.afterCompare || state.compared);
        }

        // 每一階段能不能往下走，全部集中在這裡判斷
        function gate(phase, state, sc) {
            switch (phase) {
                case 'INITIAL_BELIEF':
                    return state.initialBelief === null ? '拉一下滑桿，選你的分數' : '';
                case 'ACTION':
                    return state.actionId ? '' : '先選一個';
                case 'CLUE_HUNT': {
                    const left = SHARED.clueGoal - checkCluesFound(state, sc);
                    return left > 0 ? `再找 ${left} 處要查的` : '';
                }
                case 'EVIDENCE':
                    if (!canPickEvidence(state)) return '至少打開兩份資料';
                    return state.selectedEvidenceId ? '' : '選一份資料';
                case 'FINAL_VERDICT':
                    if (!state.verdictId) return '先選一個判斷';
                    return state.finalBelief === null ? '再拉一下滑桿' : '';
                default:
                    return '';
            }
        }

        function maxReachableIndex(state, sc) {
            let i = 0;
            while (i < state.reached && i < PHASES.length - 1 && !gate(PHASES[i], state, sc)) i++;
            return i;
        }

        function computeScores(state, sc) {
            const total = {};
            SHARED.scores.forEach(s => { total[s.id] = SHARED.scoreBase; });
            const add = delta => {
                if (!delta) return;
                Object.keys(delta).forEach(k => { total[k] += delta[k]; });
            };
            if (state.actionId) add(sc.actions[state.actionId].scoreDelta);
            sc.clues.forEach(c => { if (state.openedClues.includes(c.id)) add(c.scoreDelta); });
            const card = sc.evidenceCards.find(c => c.id === state.selectedEvidenceId);
            if (card) add(card.scoreDelta);
            if (state.verdictId) add(sc.verdictOptions[state.verdictId].scoreDelta);
            Object.keys(total).forEach(k => { total[k] = Math.max(0, Math.min(100, total[k])); });
            return total;
        }

        function feedbackFor(scoreId, state, sc) {
            const rule = sc.feedback[scoreId];
            let text = (rule.byAction && rule.byAction[state.actionId])
                || (rule.byEvidence && rule.byEvidence[state.selectedEvidenceId])
                || (rule.byVerdict && rule.byVerdict[state.verdictId])
                || rule.fallback || '';
            const suffix = rule.suffixByAction && rule.suffixByAction[state.actionId];
            return suffix ? `${text}${suffix}` : text;
        }

        function hasOwn(obj, key) {
            return Object.prototype.hasOwnProperty.call(obj, key);
        }

        function isValidState(s) {
            if (!s || s.v !== 1) return false;
            const sc = scenarioOf(s);
            if (!sc || !PHASES.includes(s.phase)) return false;
            const belief = b => b === null || (Number.isInteger(b) && b >= 0 && b <= 100);
            const clueIds = sc.clues.map(c => c.id);
            const cardIds = sc.evidenceCards.map(c => c.id);
            return belief(s.initialBelief) && belief(s.finalBelief)
                && Number.isInteger(s.reached) && s.reached >= 0 && s.reached < PHASES.length
                && (s.actionId === null || hasOwn(sc.actions, s.actionId))
                && (s.verdictId === null || hasOwn(sc.verdictOptions, s.verdictId))
                && (s.selectedEvidenceId === null || cardIds.includes(s.selectedEvidenceId))
                && Array.isArray(s.openedClues) && s.openedClues.every(id => clueIds.includes(id))
                && Array.isArray(s.readEvidence) && s.readEvidence.every(id => cardIds.includes(id))
                && new Set(s.openedClues).size === s.openedClues.length
                && new Set(s.readEvidence).size === s.readEvidence.length
                && typeof s.compared === 'boolean';
        }

        /* ========== 保存（同分頁 sessionStorage） ========== */
        function loadState() {
            try {
                const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY));
                if (isValidState(saved)) return saved;
            } catch (e) { /* 無痕或封鎖儲存時照樣能玩 */ }
            return freshState();
        }

        function saveState() {
            try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { }
        }

        /* ========== 畫面工具（一律用文字節點） ========== */
        function h(tag, attrs, ...children) {
            const el = document.createElement(tag);
            if (attrs) {
                Object.entries(attrs).forEach(([k, v]) => {
                    if (v === null || v === undefined || v === false) return;
                    if (k === 'class') el.className = v;
                    else if (k === 'text') el.textContent = v;
                    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
                    else el.setAttribute(k, v === true ? '' : v);
                });
            }
            children.flat().forEach(c => {
                if (c === null || c === undefined || c === false) return;
                el.append(c instanceof Node ? c : document.createTextNode(String(c)));
            });
            return el;
        }

        function setChildren(el, ...nodes) {
            el.textContent = '';
            el.append(...nodes);
        }

        function externalLink(ref) {
            return h('a', { href: ref.url, target: '_blank', rel: 'noopener noreferrer' }, `${ref.label} ↗`);
        }

        const CLIP_SVG = '<svg viewBox="0 0 22 50" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"><path d="M16 14v24a5 5 0 0 1-10 0V9a8 8 0 0 1 16 0v27"/></svg>';

        /* ========== 各階段畫面 ========== */
        let state = loadState();
        let collapsedCards = new Set();
        let justRevealed = null;
        let recallOpen = false;

        const screenEl = document.getElementById('screen');
        const backBtn = document.getElementById('btn-back');
        const nextBtn = document.getElementById('btn-next');
        const hintEl = document.getElementById('gate-hint');
        const liveEl = document.getElementById('live');

        function title(text, big) {
            return h('h2', { class: big ? 'phase-title big' : 'phase-title', tabindex: '-1', id: 'phase-title' }, text);
        }

        // mode: plain（純閱讀）／hunt（可點線索）／review（只留標記）
        function messageCard(sc, mode, withNote) {
            const clueBySeg = {};
            sc.clues.forEach(c => { clueBySeg[c.segmentId] = c; });
            const bubble = h('div', { class: mode === 'hunt' ? 'bubble hunt' : 'bubble' });
            // 空一行＝分段，換成固定間距，避免大行高下空得太開
            const appendText = text => text.split('\n\n').forEach((part, i) => {
                if (i) bubble.append(h('span', { class: 'para-break' }));
                bubble.append(part);
            });
            sc.messageSegments.forEach(seg => {
                const clue = clueBySeg[seg.id];
                if (!clue || mode === 'plain') {
                    appendText(seg.text);
                    return;
                }
                const opened = state.openedClues.includes(clue.id);
                if (mode === 'review') {
                    if (!opened) { appendText(seg.text); return; }
                    bubble.append(
                        h('span', { class: `seg seg-static ${clue.kind}` }, seg.text),
                        h('span', { class: `tag ${clue.kind}` }, clue.kind === 'check' ? '要查' : '不用查')
                    );
                    return;
                }
                const hintId = `hint-${clue.id}`;
                const short = seg.text.length <= 6 ? ' nowrap' : '';
                bubble.append(h('span', {
                    class: (opened ? `seg ${clue.kind}` : 'seg') + short,
                    role: 'button',
                    tabindex: '0',
                    'aria-expanded': opened ? 'true' : 'false',
                    'aria-controls': opened ? hintId : null,
                    'data-key': `clue-${clue.id}`,
                    onclick: () => openClue(clue.id),
                    onkeydown: e => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openClue(clue.id); }
                    }
                }, seg.text));
                if (opened) {
                    bubble.append(h('span', { class: `hint ${clue.kind}${justRevealed === clue.id ? ' pop' : ''}`, id: hintId },
                        h('span', { class: `tag ${clue.kind}` }, clue.kind === 'check' ? '要查' : '不用查'),
                        ' ', clue.hint));
                }
            });
            const card = h('div', { class: 'message' },
                h('div', { class: 'message-type' }, sc.sourceType),
                bubble);
            const clip = h('span', { class: 'clip', 'aria-hidden': 'true' });
            clip.innerHTML = CLIP_SVG;
            card.prepend(clip);
            const wrap = h('div', null, card);
            if (withNote) {
                wrap.append(h('p', { class: 'note' }, h('b', null, '案卷註記'), sc.caseNote));
            }
            return wrap;
        }

        function recall(sc) {
            const afterHunt = PHASES.indexOf(state.phase) > PHASES.indexOf('CLUE_HUNT');
            return h('details', { class: 'recall', open: recallOpen, ontoggle: e => { recallOpen = e.target.open; } },
                h('summary', { 'data-key': 'recall' }, '再看一次訊息'), messageCard(sc, 'review', afterHunt));
        }

        function beliefSlider(field, labelledBy) {
            const value = state[field];
            const out = h('div', { class: 'belief-value', 'aria-hidden': 'true' }, value === null ? '還沒選' : `${value} 分`);
            const box = h('div', { class: value === null ? 'belief untouched' : 'belief' });
            const input = h('input', {
                type: 'range', min: '0', max: '100', step: '1',
                value: String(value === null ? 50 : value),
                'aria-labelledby': labelledBy,
                'aria-valuetext': value === null ? '還沒選' : `${value} 分`,
                'data-key': `slider-${field}`
            });
            const set = () => {
                const v = Number(input.value);
                state[field] = v;
                saveState();
                box.classList.remove('untouched');
                out.textContent = `${v} 分`;
                input.setAttribute('aria-valuetext', `${v} 分`);
                renderActionbar();
            };
            input.addEventListener('input', set);
            input.addEventListener('change', set);
            input.addEventListener('pointerdown', e => {
                const r = input.getBoundingClientRect();
                const thumb = 36;
                const ratio = (e.clientX - r.left - thumb / 2) / (r.width - thumb);
                input.value = String(Math.round(Math.max(0, Math.min(1, ratio)) * 100));
                set();
            });
            box.append(out, input, h('div', { class: 'belief-ends', 'aria-hidden': 'true' },
                h('span', null, SHARED.beliefEnds[0]), h('span', null, SHARED.beliefEnds[1])));
            return box;
        }

        function optionList(options, selectedId, onPick, keyPrefix, row) {
            return h('div', { class: row ? 'options row' : 'options', role: 'group' },
                options.map(o => h('button', {
                    type: 'button', class: 'option',
                    'aria-pressed': o.id === selectedId ? 'true' : 'false',
                    'data-key': `${keyPrefix}-${o.id}`,

                }, o.label)));
        }

        function evidenceCard(card, sc) {
            const read = state.readEvidence.includes(card.id);
            const open = read && !collapsedCards.has(card.id);
            const selected = state.selectedEvidenceId === card.id;
            const bodyId = `card-${card.id}`;
            const head = h('button', {
                type: 'button', class: 'ecard-head',
                'aria-expanded': open ? 'true' : 'false', 'aria-controls': bodyId,
                'data-key': `card-${card.id}`,
                onclick: () => toggleCard(card.id)
            }, h('span', { class: 'ecard-letter' }, card.id), h('span', null, card.title),
                h('span', { class: 'chev', 'aria-hidden': 'true' }, open ? '收起 ▴' : '打開 ▾'));
            const el = h('article', { class: `ecard${selected ? ' selected' : ''}${justRevealed === card.id ? ' pop' : ''}`, id: `ecard-${card.id}` }, head);
            if (!open) return el;

            const refs = card.links.map(id => sc.references.find(r => r.id === id));
            const canSelect = canPickEvidence(state);
            const actions = h('div', { class: 'ecard-actions' });
            if (card.comparable && !state.compared) {
                actions.append(h('button', {
                    type: 'button', class: 'btn', 'data-key': 'compare', onclick: compare
                }, '跟其他資料對對看'));
            }
            actions.append(h('button', {
                type: 'button', class: 'btn',
                'aria-pressed': selected ? 'true' : 'false',
                'aria-disabled': canSelect ? null : 'true',
                'data-key': `pick-${card.id}`,
                onclick: () => pickEvidence(card.id)
            }, selected ? '已選這份' : '選這份'));

            el.append(h('div', { class: 'ecard-body', id: bodyId },
                h('span', { class: 'label' }, card.sourceType),
                h('dl', null,
                    h('dt', null, '內容'), h('dd', null, card.content),
                    h('dt', null, '可以參考的地方'), h('dd', null, card.useful),
                    h('dt', null, '不夠的地方'), h('dd', null, card.limits),
                    h('dt', null, '原始連結'),
                    refs.length ? refs.map(r => h('dd', null, externalLink(r))) : h('dd', null, '沒有，這是模擬的資料')),
                actions));
            return el;
        }

        const VIEWS = {
            MESSAGE(sc) {
                return [title(sc.caseLabel, true), messageCard(sc, 'plain')];
            },
            INITIAL_BELIEF(sc) {
                return [title(SHARED.prompts.INITIAL_BELIEF), messageCard(sc, 'plain'),
                h('div', { class: 'block' }, beliefSlider('initialBelief', 'phase-title'))];
            },
            ACTION(sc) {
                const chosen = state.actionId && sc.actions[state.actionId];
                return [title(SHARED.prompts.ACTION), recall(sc),
                optionList(SHARED.actions, state.actionId, pickAction, 'action'),
                chosen ? h('p', { class: 'result' }, chosen.result) : null];
            },
            CLUE_HUNT(sc) {
                return [title(SHARED.prompts.CLUE_HUNT),
                messageCard(sc, 'hunt', true)];
            },
            EVIDENCE(sc) {
                return [title(SHARED.prompts.EVIDENCE), recall(sc),
                h('div', { class: 'cards' }, visibleCards(state, sc).map(c => evidenceCard(c, sc)))];
            },
            FINAL_VERDICT(sc) {
                return [title(SHARED.prompts.FINAL_VERDICT), recall(sc),
                optionList(SHARED.verdicts, state.verdictId, pickVerdict, 'verdict', true),
                h('div', { class: 'block' },
                    h('h3', { class: 'phase-title', id: 'final-belief-label' }, SHARED.prompts.finalBelief),
                    beliefSlider('finalBelief', 'final-belief-label'))];
            },
            REFLECTION(sc) {
                const card = sc.evidenceCards.find(c => c.id === state.selectedEvidenceId);
                const verdict = SHARED.verdicts.find(v => v.id === state.verdictId);
                return [title(SHARED.prompts.REFLECTION),
                h('div', { class: 'shift' },
                    h('div', null, h('small', null, '查之前'), h('strong', null, state.initialBelief), h('small', null, '分')),
                    h('div', { class: 'arrow', 'aria-hidden': 'true' }, '→'),
                    h('div', null, h('small', null, '查之後'), h('strong', null, state.finalBelief), h('small', null, '分'))),
                h('div', { class: 'facts' },
                    h('section', null, h('span', { class: 'label' }, '你選的資料'),
                        h('p', { class: 'fact' }, `${card.id}　${card.title}`), h('p', { class: 'result' }, card.result)),
                    h('section', null, h('span', { class: 'label' }, '你的判斷'),
                        h('p', { class: 'fact' }, verdict.label), h('p', { class: 'result' }, sc.verdictOptions[state.verdictId].result))),
                h('div', { class: 'block verdict-box' },
                    h('span', { class: 'label' }, '案件結論'), h('br'),
                    h('span', { class: 'stamp' }, sc.reflection.conclusionLabel),
                    h('p', { style: 'margin:0' }, sc.reflection.conclusion)),
                h('p', { class: 'block move' }, sc.learningPoint),
                h('div', { class: 'block' },
                    h('span', { class: 'label' }, `${sc.reflection.checkPoints.length} 個要查的地方`),
                    h('ol', { class: 'checklist' }, sc.reflection.checkPoints.map(t => h('li', null, t))))];
            },
            RESULT(sc) {
                const scores = computeScores(state, sc);
                return [title(SHARED.prompts.RESULT),
                h('div', { class: 'scores' }, SHARED.scores.map(s => h('section', { class: 'score' },
                    h('div', { class: 'score-head' }, h('h3', { style: 'margin:0;font-size:inherit' }, s.label), h('span', null, scores[s.id])),
                    h('div', { class: 'meter', role: 'img', 'aria-label': `${s.label} ${scores[s.id]} 分，滿分 100` },
                        h('i', { style: `width:${scores[s.id]}%` })),
                    h('p', null, feedbackFor(s.id, state, sc)))))];
            }
        };

        /* ========== 繪製 ========== */
        function render(phaseChanged) {
            const sc = scenarioOf(state);
            const focusKey = !phaseChanged && document.activeElement && document.activeElement.dataset
                ? document.activeElement.dataset.key : null;
            const y = window.scrollY;

            if (phaseChanged) recallOpen = false;
            const content = h('div', { class: phaseChanged ? 'enter' : null }, VIEWS[state.phase](sc));
            setChildren(screenEl, content);
            renderChrome(sc);
            renderActionbar();
            justRevealed = null;

            if (phaseChanged) {
                window.scrollTo(0, 0);
                document.getElementById('phase-title').focus({ preventScroll: true });
            } else {
                window.scrollTo(0, y);
                const again = focusKey && screenEl.querySelector(`[data-key="${focusKey}"]`);
                if (again) again.focus({ preventScroll: true });
            }
        }

        function renderChrome(sc) {
            const idx = PHASES.indexOf(state.phase);
            const steps = PHASES.length - 1;
            const progress = document.getElementById('progress');
            progress.hidden = idx === 0;
            document.getElementById('progress-text').textContent = `${sc.caseLabel}　${idx}／${steps}`;
            setChildren(document.getElementById('progress-bar'),
                ...Array.from({ length: steps }, (_, i) => h('span', { class: i < idx ? 'on' : null })));
            document.getElementById('credit').hidden = state.phase !== 'RESULT';
        }

        function renderActionbar() {
            const sc = scenarioOf(state);
            const blocked = gate(state.phase, state, sc);
            backBtn.classList.toggle('gone', state.phase === 'MESSAGE');
            nextBtn.textContent = SHARED.nextLabels[state.phase];
            if (blocked) nextBtn.setAttribute('aria-disabled', 'true');
            else nextBtn.removeAttribute('aria-disabled');
            hintEl.textContent = blocked;
        }

        let nudgeTimer = 0;

        function nudge() {
            hintEl.classList.remove('nudge');
            void hintEl.offsetWidth;
            hintEl.classList.add('nudge');
            clearTimeout(nudgeTimer);
            nudgeTimer = setTimeout(() => hintEl.classList.remove('nudge'), 1200);
            announce(hintEl.textContent);
        }

        /* ========== 操作 ========== */
        function update(mutator) {
            mutator(state);
            saveState();
            render(false);
        }

        function openClue(id) {
            if (state.openedClues.includes(id)) return;
            justRevealed = id;
            update(s => { s.openedClues = [...s.openedClues, id]; });
        }

        function announce(text) {
            liveEl.textContent = '';
            setTimeout(() => { liveEl.textContent = text; }, 50);
        }

        function pickAction(id) {
            update(s => { s.actionId = id; });
            announce(scenarioOf(state).actions[id].result);
        }

        function pickVerdict(id) { update(s => { s.verdictId = id; }); }

        const cardOpenedAt = {};

        function toggleCard(id) {
            if (!state.readEvidence.includes(id)) {
                collapsedCards.delete(id);
                cardOpenedAt[id] = performance.now();
                update(s => { s.readEvidence = [...s.readEvidence, id]; });
                return;
            }
            if (performance.now() - (cardOpenedAt[id] || 0) < NAV_LOCK_MS) return;
            if (collapsedCards.has(id)) collapsedCards.delete(id); else collapsedCards.add(id);
            render(false);
        }

        function compare() {
            const sc = scenarioOf(state);
            const revealed = sc.evidenceCards.filter(c => c.afterCompare).map(c => c.id);
            justRevealed = revealed[0];
            update(s => {
                s.compared = true;
                s.readEvidence = [...new Set([...s.readEvidence, ...revealed])];
            });
            const el = document.getElementById(`ecard-${revealed[0]}`);
            if (el) {
                const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
                el.querySelector('.ecard-head').focus({ preventScroll: true });
            }
        }

        function pickEvidence(id) {
            if (!canPickEvidence(state)) { nudge(); return; }
            update(s => { s.selectedEvidenceId = id; });
        }

        /* ========== 前進、返回、重玩（遊戲內返回＝瀏覽器返回） ==========
           不變式：本分頁歷史紀錄第 i 筆就是第 i 階段，返回一律走瀏覽器歷史。 */
        const NAV_LOCK_MS = 700;
        let navLockUntil = 0;

        function navLocked() {
            return performance.now() < navLockUntil;
        }

        function lockNav() {
            navLockUntil = performance.now() + NAV_LOCK_MS;
        }

        function entry(idx) {
            return { tea: 1, phase: PHASES[idx] };
        }

        function historyIndex() {
            return history.state && history.state.tea ? PHASES.indexOf(history.state.phase) : -1;
        }

        function show(idx) {
            state.phase = PHASES[idx];
            state.reached = Math.max(state.reached, idx);
            saveState();
            lockNav();
            render(true);
        }

        function next() {
            if (navLocked()) return;
            const sc = scenarioOf(state);
            if (state.phase === 'RESULT') { restart(); return; }
            if (gate(state.phase, state, sc)) { nudge(); return; }
            const idx = PHASES.indexOf(state.phase) + 1;
            history.pushState(entry(idx), '');
            show(idx);
        }

        function back() {
            if (navLocked() || state.phase === 'MESSAGE') return;
            lockNav();
            history.back();
        }

        function restart() {
            const idx = historyIndex();
            state = freshState(state.scenarioId);
            collapsedCards = new Set();
            show(0);
            if (idx > 0) history.go(-idx);
            else history.replaceState(entry(0), '');
        }

        window.addEventListener('popstate', e => {
            if (!e.state || !e.state.tea) return;
            const wanted = PHASES.indexOf(e.state.phase);
            const allowed = maxReachableIndex(state, scenarioOf(state));
            // 資料不足以停在這一步（重玩後按前進、存檔遺失）就退回能到的那一筆
            if (wanted > allowed) { history.go(allowed - wanted); return; }
            show(Math.max(wanted, 0));
        });

        backBtn.addEventListener('click', back);
        nextBtn.addEventListener('click', next);

        /* ========== 啟動：刷新時接回本分頁進度 ========== */
        (function init() {
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            const sc = scenarioOf(state);
            const allowed = maxReachableIndex(state, sc);
            const fromHistory = historyIndex();
            if (fromHistory < 0) {
                // 沒有本遊戲的歷史紀錄（新開或同分頁重開網址）：補齊前面各階段，返回才有路
                const target = Math.min(PHASES.indexOf(state.phase), allowed);
                history.replaceState(entry(0), '');
                for (let i = 1; i <= target; i++) history.pushState(entry(i), '');
                state.phase = PHASES[target];
            } else if (fromHistory > allowed) {
                state.phase = PHASES[allowed];
                history.go(allowed - fromHistory);
            } else {
                state.phase = PHASES[fromHistory];
            }
            saveState();
            try {
                render(false);
            } catch (err) {
                // 存檔內容畫不出來就重開一局，避免整頁空白
                state = freshState();
                saveState();
                history.replaceState(entry(0), '');
                render(false);
            }
        })();
    </script>
</body>

</html>
